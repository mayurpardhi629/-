<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>चांभारखिंड ग्राम नागरिक शोध</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
header{background:#0f4c81;color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
button{margin-top:10px;padding:12px 20px;border:none;border-radius:8px;background:#0f4c81;color:white;cursor:pointer}
.result{margin-top:20px}
.profile{border:1px solid #ddd;border-radius:10px;padding:15px;margin-top:10px}
.photo{width:120px;height:120px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header>
<h1>चांभारखिंड ग्राम नागरिक शोध प्रणाली</h1>
<p>नाव टाकून नागरिकांची माहिती शोधा</p>
</header>

<div class="container">
<div class="card">
<input id="searchBox" placeholder="नाव शोधा...">
<button onclick="searchPerson()">शोधा</button>
<div id="result" class="result"></div>
</div>
</div>

<script>
const people=[
{
name:"मयुर पारधी",
address:"मधली आळी",
mobile:"9561101713",
house:"322",
photo:"फोटो अपडेट करायचा आहे"
},
{
name:"संदेश पारधी",
address:"उगवती आळी",
mobile:"8805450875",
house:"344",
photo:"फोटो अपडेट करायचा आहे"
}
];

function searchPerson(){
const q=document.getElementById('searchBox').value.trim().toLowerCase();
const person=people.find(p=>p.name.toLowerCase().includes(q));

const result=document.getElementById('result');

if(person){
result.innerHTML=`
<div class="profile">
<div class="photo">फोटो</div>
<h2>${person.name}</h2>
<p><b>पत्ता:</b> ${person.address}</p>
<p><b>मोबाईल:</b> ${person.mobile}</p>
<p><b>घर क्रमांक:</b> ${person.house}</p>
</div>`;
}else{
result.innerHTML="<p>माहिती सापडली नाही.</p>";
}
}
</script>
</body>
</html>
